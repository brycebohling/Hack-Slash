name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Avoid overlapping deploys racing each other.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No build step: dist/ holds the complete Unity WebGL build, committed
      # after each Unity export (see README.md).
      #
      # The Pages project itself (plus custom domain and DNS) is owned by
      # Terraform in the cf-infra repo — this workflow only deploys builds.
      # --branch=main marks the deployment as production; custom domains
      # serve production deployments only.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=hs --branch=main
